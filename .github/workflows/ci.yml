name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run checks
        run: ./ci.sh
